# 키·모델 없이 연습용 픽스처(mock 서버)만으로 전체 흐름을 검증한다(Node.js·TypeScript).
# macOS·Linux 둘 다 돌리는 이유: gui 프로필 PATH 와 "env: X: No such file" 메시지 형식이 OS 마다 다르다.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # 매주 월요일 — 의존성·런타임이 바뀌어 깨지지 않았는지 정기 확인
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          DEMO_MODE: mock
      - run: npm run build --if-present
      - name: dry-run contract (AC-5)
        run: node dist/cli.js check --client codex --config fixtures/configs/codex.toml --dry-run --json
      - name: practice demo
        run: node dist/cli.js demo --lang en
      - name: package contents
        run: npm pack --dry-run --json > /dev/null
